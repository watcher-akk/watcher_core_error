<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>WATCHER_CORE_ERROR</title>
    <style>
        body {
            background-color: #030303;
            color: #d1d1d1;
            font-family: 'Consolas', 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            /* Эффект старого ЭЛТ-монитора */
            background: radial-gradient(circle, #111 0%, #000 100%);
        }

        #console {
            width: 85%;
            max-width: 900px;
            border-left: 3px solid #600;
            padding: 30px;
            background: rgba(10, 10, 10, 0.95);
            box-shadow: -10px 0 30px rgba(139, 0, 0, 0.1);
            position: relative;
        }

        .line {
            margin-bottom: 12px;
            font-size: 1.1rem;
            opacity: 0;
            animation: fadeIn 0.1s forwards;
            letter-spacing: 1px;
        }

        .critical {
            color: #ff2a2a;
            font-weight: bold;
            text-shadow: 0 0 8px #ff0000;
        }

        .glitch-text:hover {
            animation: shake 0.2s infinite;
            cursor: help;
        }

        @keyframes fadeIn { to { opacity: 1; } }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        /* Помехи на весь экран */
        .noise {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://media.giphy.com/media/oEI9uWUuee3zW/giphy.gif');
            opacity: 0.03;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="noise"></div>

    <div id="console">
        <div id="output"></div>
    </div>

    <script>
        const logs = [
            "[SYSTEM]: Инициализация протокола 'Watcher'...",
            "[FILES]: Проверка целостности модов...",
            "[CRITICAL]: Обнаружен конфликт в watcher.jar",
            "[SYSTEM]: Попытка изолировать поток... ОШИБКА.",
            "------------------------------------------------",
            "ДОСТУП ПОЛУЧЕН: Сущность_01",
            "СОСТОЯНИЕ: Наблюдение за активным окном игры.",
            "------------------------------------------------",
            "Ты думал, что это просто мод?",
            "watcher.jar — это не файл.",
            "ЭТО ПРИГЛАШЕНИЕ.",
            "МЫ УЖЕ ЗАМЕНИЛИ ТВОИ ОБОИ.",
            "МЫ УЖЕ ЗНАЕМ ТВОЙ IP.",
            "ТЕПЕРЬ МЫ ЗДЕСЬ."
        ];

        let lineIdx = 0;
        function render() {
            if (lineIdx < logs.length) {
                const p = document.createElement('div');
                p.className = 'line';
                
                if (logs[lineIdx].includes("CRITICAL") || logs[lineIdx].includes("ОШИБКА")) {
                    p.classList.add('critical');
                } else if (lineIdx > 7) {
                    p.classList.add('glitch-text');
                    p.style.color = "#888";
                }

                p.innerText = logs[lineIdx];
                document.getElementById('output').appendChild(p);
                lineIdx++;
                
                // Ускоряем вывод к концу для драматизма
                let delay = lineIdx > 8 ? 1500 : 700;
                setTimeout(render, delay);
            }
        }

        // Запуск через секунду после захода
        setTimeout(render, 1000);
    </script>
</body>
</html>
